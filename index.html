<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kurt Foster’s background in industrial maintenance and Industrial Automation Technology.">
  <title>Kurt Foster</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23f0eee6'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-size='25' fill='%231f1e1d'%3EK%3C/text%3E%3C/svg%3E">
  <script>
    try {
      const saved = localStorage.getItem('kurt-foster-theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
    } catch (_) {}
  </script>
  <style>

    :root { color-scheme: dark; --paper: #1f1e1d; --ink: #f0eee6; }
    :root[data-theme="light"] { color-scheme: light; --paper: #f0eee6; --ink: #1f1e1d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-size: 1.25rem; line-height: 1.6; }
    .container { width: 100%; max-width: 38.75rem; margin-inline: auto; padding-inline: 20px; }
    header { margin-top: 15px; margin-bottom: 25px; }
    header .container { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 53.8px; }
    h1 { margin: 0; font-size: 1.8rem; line-height: 1; font-weight: 600; }
    h1 a { color: inherit; text-decoration: none; }
    p { margin: 0 0 20px; }
    main { padding-bottom: 60px; }
    .theme-toggle { flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; display: grid; place-items: center; }
    .track { display: block; width: 36px; height: 18px; background: var(--ink); border-radius: 20px; padding: 2px; }
    .thumb { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); }
    .theme-toggle[aria-checked="true"] .thumb { transform: translateX(18px); }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; border-radius: 3px; }
    @media (max-width: 767px) { .container { width: 80%; max-width: none; padding-inline: 10px; } }
    @media (max-width: 479px) { .container { width: 95%; } }
    @media print { .theme-toggle { display: none; } :root { --paper: white !important; --ink: black !important; } }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="#">Kurt Foster</a></h1>
      <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode" hidden>
        <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      </button>
    </div>
  </header>
  <main class="container">
    <p>I'm looking for part-time opportunities while attending college.</p>
    <p>Previously, from 2018 to 2026, I mainly worked as a Maintenance Technician across automotive and food manufacturing.</p>
    <p>I hold an Associate of Applied Science (AAS) degree in Industrial Automation Technology.</p>
  </main>
  <script>
    const toggle = document.querySelector('.theme-toggle');
    function isDark() {
      return document.documentElement.dataset.theme !== 'light';
    }
    function syncToggle() { toggle.setAttribute('aria-checked', String(isDark())); }
    toggle.hidden = false;
    syncToggle();
    toggle.addEventListener('click', () => {
      const theme = isDark() ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('kurt-foster-theme', theme); } catch (_) {}
      syncToggle();
    });
  </script>
</body>
</html>
